appId: com.photo-culler.app
productName: Photo Culler

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!node_modules'
  # ${os}-${arch} is expanded per pack pass, so each artifact gets only its own
  # native binaries. Use ${os} (mac/win/linux), NEVER ${platform} — that one
  # expands to the HOST platform and would be correct only on the build machine.
  - from: vendor/${os}-${arch}/node_modules
    to: node_modules

# Assertion-only: fails the build if foreign-platform binaries slipped in.
afterPack: ./scripts/verify-pack.mjs

npmRebuild: false
asar: false
publish: null

mac:
  icon: build/icon.icns
  category: public.app-category.photography
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-${version}-win-${arch}-setup.${ext}'
