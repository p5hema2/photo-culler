name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Nothing else in CI packages anything, so a malformed builder config would
      # otherwise first surface on a `v*` tag push — after the tag is public.
      # Validated against electron-builder's own scheme.json; the specific trap is
      # that a root `zip:` block is rejected outright while `nsis:` and `portable:`
      # are not, so the archive targets must be named via `<platform>.artifactName`.
      - name: Validate electron-builder config
        working-directory: apps/desktop
        run: pnpm validate:builder

      - name: Build
        run: pnpm build

      # Asserts on the BUILT bundle that the portable userData redirect is emitted
      # before electron-store is constructed. Source import order does not decide
      # this, and getting it wrong fails silently — see src/main/portable.ts.
      - name: Verify userData redirect precedes electron-store
        working-directory: apps/desktop
        run: pnpm verify:path-order

      - name: Detect native addons
        shell: bash
        run: |
          if pnpm ls --depth Infinity 2>/dev/null | grep -iE "node-gyp|prebuild-install|node-pre-gyp|cmake-js"; then
            echo "::error::Native addon dependency detected! This project must have zero native dependencies (INFRA-02)."
            exit 1
          fi
          echo "No native addon dependencies found."
